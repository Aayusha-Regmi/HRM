kind: Deployment
apiVersion: apps/v1
metadata: 
  name: server-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: 
      app: server
  
  template:
    metadata:
      labels:
        app: server

    
    spec:
      initContainers:
      - name: test-mysql-init
        image: busybox:1.36.1
        command: ["sh", "-c", "until nc -z mysql:3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: server-container
          image: "{{ .Values.server.image }}:{{ .Values.server.tag }}"
          imagePullPolicy: {{ .Values.server.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.server.containerPort }}
          envFrom:
            - configMapRef:
                name: configmaps-server
            - secretRef: 
                name: secrets-server
        
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.server.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.server.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
{{ toYaml .Values.server.resources | indent 12 }}


      



        


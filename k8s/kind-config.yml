kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hrm-cluster
nodes:
- role: control-plane
  image: kindest/node:v1.36.1
  #this label is needed to have nginx ingress controller pods find nodes to run it
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"  

- role: worker
  image: kindest/node:v1.36.1

- role: worker
  image: kindest/node:v1.36.1

- role: worker
  image: kindest/node:v1.36.1

  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
